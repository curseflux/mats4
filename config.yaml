# Conflict-awareness experiment configuration.

project:
  seed: 20260816

paths:
  dataset_dir: conflict_awareness_dataset
  output_dir: results/gemma4_12b_conflict
  hf_cache_dir: /scratch/bbjr/skarmakar/huggingface

model:
  id: google/gemma-4-12B-it
  revision: 707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7
  transformers_version: 5.15.0
  dtype: bfloat16
  device_map: auto
  attention_implementation: sdpa
  trust_remote_code: false
  local_files_only: false

chat:
  enable_thinking: false
  add_generation_prompt: true
  max_input_tokens: 2048

generation:
  do_sample: false
  max_new_tokens: 16
  use_cache: true

screening:
  batch_size: 4
  scoring_batch_size: 8
  results_file: screening_results.jsonl
  eligible_facts_file: eligible_facts.jsonl
  run_metadata_file: 01_screen_run.json
  require_all_template_bundles: true
  min_true_minus_false_logprob: 0.0

collection:
  generation_batch_size: 4
  scoring_batch_size: 8
  activation_batch_size: 2
  behavior_results_file: behavior_results.jsonl
  run_metadata_file: 02_collect_run.json

  require_complete_factorial_groups: true

  activations:
    enabled: false
    directory: activations
    manifest_file: manifest.json
    shard_size: 128
    storage_dtype: float16
    layers: all
    positions:
      - claim_end
      - context_end
      - prompt_end
      - assistant_start

runtime:
  report_every_batches: 10
